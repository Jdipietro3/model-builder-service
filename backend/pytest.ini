[pytest]
testpaths = tests
# Training-backed tests take ~10-20s each; mark them so a tight edit loop can
# skip them with `-m "not slow"`. They still run by default, because the golden
# equivalence check is the whole point of the suite.
markers =
    slow: exercises real model training (tens of seconds)
filterwarnings =
    ignore::UserWarning:sklearn.utils.parallel
