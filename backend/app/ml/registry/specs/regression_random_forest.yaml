id: regression.random_forest
display_name: Random Forest Regressor
task_types: [regression]
data_shape: tabular
task_family: supervised
compute: { device: cpu }
when_to_use: >
  Robust non-linear ensemble for regression with little tuning required.
  Good for small-to-medium datasets with non-linear relationships and
  outliers. Predictions are bounded by the training target range (cannot
  extrapolate beyond it).
preprocessing:
  numeric: { impute: median, scale: false }
  categorical: { impute: most_frequent, encode: onehot }
model:
  class: sklearn.ensemble.RandomForestRegressor
  params: { n_estimators: 300, n_jobs: -1, random_state: 42 }
  grid:
    max_depth: [10, null]
    min_samples_leaf: [1, 5]
metrics:
  regression: { default: r2, supported: [r2, mae, rmse] }
