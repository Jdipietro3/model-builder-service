id: classification.lightgbm
display_name: Gradient Boosting (LightGBM)
task_types: [binary_classification, multiclass_classification]
data_shape: tabular
task_family: supervised
compute: { device: cpu }
when_to_use: >
  The default workhorse for tabular classification. Gradient-boosted trees
  are the strongest known approach for most structured-data problems from a
  few thousand to millions of rows. Handles non-linearities, interactions,
  and mixed types. Prefer this unless the dataset is tiny (< 1k rows, where
  simpler models generalize better) or interpretability of coefficients is
  the priority.
preprocessing:
  numeric: { impute: median, scale: false }
  categorical: { impute: most_frequent, encode: onehot }
model:
  class: lightgbm.LGBMClassifier
  params: { n_estimators: 300, learning_rate: 0.05, random_state: 42, verbosity: -1 }
  grid:
    num_leaves: [15, 31]
    learning_rate: [0.05, 0.1]
  search_space:
    num_leaves: { type: int, low: 7, high: 127, log: true }
    learning_rate: { type: float, low: 0.01, high: 0.3, log: true }
    n_estimators: { type: int, low: 100, high: 800 }
    min_child_samples: { type: int, low: 5, high: 100, log: true }
    subsample: { type: float, low: 0.5, high: 1.0 }
    colsample_bytree: { type: float, low: 0.4, high: 1.0 }
    reg_lambda: { type: float, low: 0.001, high: 10, log: true }
  fallback:
    class: sklearn.ensemble.HistGradientBoostingClassifier
    params: { max_iter: 300, learning_rate: 0.05, random_state: 42 }
    grid:
      max_leaf_nodes: [15, 31]
      learning_rate: [0.05, 0.1]
    search_space:
      max_leaf_nodes: { type: int, low: 7, high: 127, log: true }
      learning_rate: { type: float, low: 0.01, high: 0.3, log: true }
      max_iter: { type: int, low: 100, high: 800 }
      min_samples_leaf: { type: int, low: 5, high: 100, log: true }
      l2_regularization: { type: float, low: 0.001, high: 10, log: true }
metrics:
  binary_classification: { default: roc_auc, supported: [roc_auc, pr_auc, f1, accuracy, balanced_accuracy] }
  multiclass_classification: { default: f1_macro, supported: [f1_macro, accuracy, balanced_accuracy] }
feature_ops_allowed: [drop, impute, encode, datetime_expand, log_transform, clip_outliers, bin, arithmetic, group_aggregate, select, class_balance, target_transform]
